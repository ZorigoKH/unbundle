name: live data

on:
  schedule:
    - cron: "17 14 5,20 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: live-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live]"
      - name: Build
        run: python -m live.build --out web/data
      - name: Validate
        run: python -m live.validate web/data
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- web/data)" ]; then
            echo "web/data is unchanged"
            exit 0
          fi
          through=$(python -c "import json; print(json.load(open('web/data/meta.json'))['through'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- web/data
          git commit -m "Refresh the live data through ${through}"
          git push
